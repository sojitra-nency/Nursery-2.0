allowBuilds:
  esbuild: true
  workerd: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - workerd
  - unrs-resolver
# sharp is an optional native dep of Next; we deliberately skip its build.
# next/image is `unoptimized` (Sanity CDN optimizes) and native binaries
# can't run in the Cloudflare Workers runtime. Marked ignored so pnpm 10+
# doesn't fail the install over an un-categorized build script.
ignoredBuiltDependencies:
  - sharp
